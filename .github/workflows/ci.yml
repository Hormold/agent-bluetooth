name: ci
on:
  push:
    branches: [master]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      UV_FROZEN: "1"  # every uv call uses uv.lock as is (see the sync step)
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get install -y --no-install-recommends libusb-1.0-0
      # Frozen (job env): install exactly uv.lock. It is resolved locally under a 7-day
      # minimum release age (user uv config), which --locked would re-check here.
      - run: uv sync
      - run: scripts/check.sh
