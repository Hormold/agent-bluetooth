# Copy to config.toml. Usually only `transport` needs changing.

[bluetooth]
transport = "usb:0+sco=2"    # first USB dongle; or "usb:VID:PID+sco=2". +sco=2 = call audio
name = "Agent Bluetooth"     # what the phone shows when pairing
keystore = "~/.agent-bluetooth/keys.json"

[phone]
adapter = "bumble-hfp"       # calls + call audio (hands-free profile)

[messages]
adapter = "bumble-map"       # SMS (Android); "none" to disable
fetch_full = false           # true = full text, but marks messages read on most phones

[directory]
adapter = "bumble-pbap"      # contacts + call history

[bridge]
adapter = "livekit"
url = "${LIVEKIT_URL:-ws://127.0.0.1:7880}"          # local `livekit-server --dev`, or wss://xxx.livekit.cloud
api_key = "${LIVEKIT_API_KEY:-devkey}"
api_secret = "${LIVEKIT_API_SECRET:-secret}"
# client_url = "ws://192.168.1.10:7880"             # what other machines use, if different from url

[routing]
answer = "on_join"           # pick up when someone (you or an agent) joins the call room

[http]
host = "127.0.0.1"           # "0.0.0.0" to reach it from other machines (then set api_key)
port = 8080
api_key = "${AGENT_BLUETOOTH_KEY:-}"

[[sinks]]
adapter = "log"

