name: AgentPhone
options:
  bundleIdPrefix: com.agentbluetooth
  deploymentTarget:
    macOS: "14.0"
packages:
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    from: "2.0.3"
targets:
  AgentPhone:
    type: application
    platform: macOS
    sources: [Sources]
    dependencies:
      - package: LiveKit
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Agent Phone
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "14.0"
        NSMicrophoneUsageDescription: Agent Phone needs the microphone so you can talk on calls bridged from your phone.
        NSLocalNetworkUsageDescription: Agent Phone talks to your Agent Bluetooth box on the local network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: Sources/AgentPhone.entitlements
      properties:
        com.apple.security.app-sandbox: false  # installs/starts local services (brew, uv, LaunchAgents)
        com.apple.security.network.client: true
        com.apple.security.network.server: true  # WebRTC binds UDP sockets for ICE
        com.apple.security.device.audio-input: true
        com.apple.security.files.user-selected.read-only: true  # pick a greeting WAV
        com.apple.security.cs.disable-library-validation: true  # load LiveKit's prebuilt (LiveKit-signed) WebRTC framework
    settings:
      base:
        MARKETING_VERSION: "0.2.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete  # implied by Swift 6; explicit so a downgrade can't drop it
        SWIFT_TREAT_WARNINGS_AS_ERRORS: true
        GCC_TREAT_WARNINGS_AS_ERRORS: true
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: true
