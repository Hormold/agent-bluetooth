<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="-apple-system, 'SF Pro Display', 'Segoe UI', Inter, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0E16"/>
      <stop offset="1" stop-color="#0D1420"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2DA7F0"/>
      <stop offset="1" stop-color="#5B8CFF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2DA7F0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2DA7F0" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- subtle dot grid -->
  <g fill="#1B2535">
    <!-- generated rows -->
    <g>
      <!-- use pattern via many small circles is heavy; emulate faint grid lines -->
    </g>
  </g>
  <g stroke="#13203260" stroke-width="1">
    <path d="M0 225 H1600 M0 450 H1600 M0 675 H1600"/>
    <path d="M400 0 V900 M800 0 V900 M1200 0 V900"/>
  </g>
  <ellipse cx="800" cy="520" rx="620" ry="320" fill="url(#glow)"/>

  <!-- wordmark -->
  <g transform="translate(140,150)">
    <g transform="translate(0,0)">
      <!-- bluetooth mark -->
      <circle cx="34" cy="34" r="34" fill="#101B2B" stroke="#223247" stroke-width="1.5"/>
      <path d="M34 14 L46 24 L28 38 L28 14 L28 54 L46 44 L34 54" fill="none" stroke="url(#accent)" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/>
    </g>
    <text x="90" y="46" font-size="40" font-weight="700" fill="#E8EDF4" letter-spacing="-0.5">Agent Bluetooth</text>
  </g>

  <!-- headline -->
  <g transform="translate(140,300)">
    <text font-size="92" font-weight="800" letter-spacing="-2.5" fill="#F3F6FB">
      <tspan x="0" y="0">Your phone's calls &amp; SMS,</tspan>
      <tspan x="0" y="108">as an <tspan fill="url(#accent)">API</tspan>.</tspan>
    </text>
    <text x="4" y="196" font-size="34" fill="#93A0B3" font-weight="400">Over plain Bluetooth. No Twilio, no SIP, no second number.</text>
  </g>

  <!-- flow chips -->
  <g transform="translate(140,640)" filter="url(#soft)">
    <!-- phone -->
    <g>
      <rect x="0" y="0" width="150" height="170" rx="22" fill="#111A28" stroke="#243449" stroke-width="1.5"/>
      <rect x="22" y="20" width="106" height="110" rx="10" fill="#0B1220" stroke="#1E2C40"/>
      <circle cx="75" cy="150" r="7" fill="#243449"/>
      <text x="75" y="205" font-size="22" fill="#93A0B3" text-anchor="middle">phone</text>
    </g>
    <!-- arrow -->
    <g transform="translate(176,85)">
      <path d="M0 0 H150" stroke="url(#accent)" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>
      <path d="M150 -7 L166 0 L150 7 Z" fill="#5B8CFF"/>
      <text x="80" y="-18" font-size="18" fill="#6E7D92" text-anchor="middle">Bluetooth</text>
    </g>
    <!-- box -->
    <g transform="translate(352,15)">
      <rect x="0" y="0" width="190" height="140" rx="18" fill="#111A28" stroke="#243449" stroke-width="1.5"/>
      <rect x="22" y="26" width="146" height="20" rx="5" fill="#172336"/>
      <rect x="22" y="58" width="110" height="14" rx="5" fill="#172336"/>
      <rect x="22" y="84" width="130" height="14" rx="5" fill="#172336"/>
      <circle cx="152" cy="112" r="6" fill="#22C55E"/>
      <text x="95" y="185" font-size="22" fill="#93A0B3" text-anchor="middle">the box (Pi / Linux)</text>
    </g>
    <!-- arrow 2 -->
    <g transform="translate(560,85)">
      <path d="M0 0 H150" stroke="url(#accent)" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>
      <path d="M150 -7 L166 0 L150 7 Z" fill="#5B8CFF"/>
      <text x="80" y="-18" font-size="18" fill="#6E7D92" text-anchor="middle">LiveKit</text>
    </g>
    <!-- room -->
    <g transform="translate(736,15)">
      <rect x="0" y="0" width="200" height="140" rx="18" fill="#0E1A2A" stroke="#1E3350" stroke-width="1.5"/>
      <circle cx="70" cy="70" r="26" fill="#13233A" stroke="#2DA7F0" stroke-width="1.5"/>
      <text x="70" y="78" font-size="24" fill="#8FC7F3" text-anchor="middle">🎧</text>
      <circle cx="130" cy="70" r="26" fill="#13233A" stroke="#5B8CFF" stroke-width="1.5"/>
      <text x="130" y="78" font-size="24" fill="#B9C8FF" text-anchor="middle">🤖</text>
      <text x="100" y="185" font-size="22" fill="#93A0B3" text-anchor="middle">you / an agent</text>
    </g>
  </g>

  <text x="140" y="862" font-size="20" fill="#5A6678" text-anchor="start">pure python · open source · a weekend project</text>
</svg>
