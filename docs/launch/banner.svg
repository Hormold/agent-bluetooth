<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840" font-family="'Geist','Inter','SF Pro Display',-apple-system,sans-serif">
  <rect width="1600" height="840" fill="#0A0A0A"/>
  <!-- hairline frame -->
  <rect x="0.5" y="0.5" width="1599" height="839" fill="none" stroke="#1A1A1A" stroke-width="1"/>

  <!-- top row: mark + name -->
  <g transform="translate(96,92)">
    <g>
      <path d="M12 2 L24 11 L6 24 L6 2 L6 38 L24 29 L12 38" fill="none" stroke="#FAFAFA" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    </g>
    <text x="48" y="22" font-size="20" fill="#A1A1A1" font-family="'Geist Mono','SF Mono',Menlo,monospace" letter-spacing="0.5">agent-bluetooth</text>
  </g>

  <!-- headline -->
  <g transform="translate(94,330)">
    <text font-size="132" font-weight="700" letter-spacing="-5" fill="#FAFAFA">
      <tspan x="0" y="0">Your phone,</tspan>
      <tspan x="0" y="150">as an API.</tspan>
    </text>
  </g>

  <!-- subhead -->
  <text x="96" y="690" font-size="30" fill="#8A8A8A" font-weight="400" letter-spacing="-0.3">Calls &amp; SMS over plain Bluetooth. No Twilio, no SIP, no second number.</text>

  <!-- mono command -->
  <g transform="translate(96,742)" font-family="'Geist Mono','SF Mono',Menlo,monospace">
    <text font-size="22" fill="#5A5A5A"><tspan fill="#5A5A5A">$ </tspan><tspan fill="#D4D4D4">agent-bluetooth</tspan> watch | call | bridge | sms</text>
  </g>

  <!-- right: faint oversized bluetooth glyph -->
  <g transform="translate(1180,250)" opacity="0.9">
    <path d="M60 10 L150 80 L20 180 L20 10 L20 290 L150 220 L60 290"
          fill="none" stroke="#161616" stroke-width="26" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M60 10 L150 80 L20 180 L20 10 L20 290 L150 220 L60 290"
          fill="none" stroke="#242424" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
</svg>
