<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="-apple-system,'SF Pro Display',Inter,sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0E16"/><stop offset="1" stop-color="#0D1420"/>
    </linearGradient>
    <linearGradient id="ac2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2DA7F0"/><stop offset="1" stop-color="#5B8CFF"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="30" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg2)"/>
  <g stroke="#13203250" stroke-width="1"><path d="M0 300 H1600 M0 600 H1600 M533 0 V900 M1066 0 V900"/></g>

  <!-- title -->
  <g transform="translate(130,96)">
    <circle cx="26" cy="22" r="26" fill="#101B2B" stroke="#223247"/>
    <path d="M26 6 L38 16 L20 30 L20 6 L20 44 L38 34 L26 44" fill="none" stroke="url(#ac2)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="70" y="24" font-size="30" font-weight="700" fill="#E8EDF4">Agent Bluetooth</text>
    <text x="70" y="56" font-size="22" fill="#8B96A5">one CLI an agent drives — like a browser, but it's your phone</text>
  </g>

  <!-- terminal window -->
  <g transform="translate(130,170)" filter="url(#sh)" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">
    <rect x="0" y="0" width="1340" height="610" rx="16" fill="#0C131E" stroke="#1E2C40" stroke-width="1.5"/>
    <rect x="0" y="0" width="1340" height="46" rx="16" fill="#101925"/>
    <rect x="0" y="30" width="1340" height="16" fill="#101925"/>
    <circle cx="28" cy="23" r="7" fill="#FF5F57"/><circle cx="52" cy="23" r="7" fill="#FEBC2E"/><circle cx="76" cy="23" r="7" fill="#28C840"/>
    <text x="670" y="28" font-size="16" fill="#5A6678" text-anchor="middle">agent-bluetooth</text>

    <g font-size="22" transform="translate(34,92)">
      <text y="0" fill="#5A6678">$ <tspan fill="#E8EDF4">agent-bluetooth watch</tspan></text>
      <text y="38" fill="#3E4A5C">{"type":<tspan fill="#8FC7F3">"call.ringing"</tspan>,"data":{"call":{"number":<tspan fill="#9BE7B4">"+1 415 …"</tspan>,"direction":<tspan fill="#9BE7B4">"in"</tspan>}}}</text>
      <text y="80" fill="#5A6678">$ <tspan fill="#E8EDF4">agent-bluetooth bridge</tspan>   <tspan fill="#5A6678"># answer → LiveKit room</tspan></text>
      <text y="118" fill="#3E4A5C">{"type":<tspan fill="#8FC7F3">"room.opened"</tspan>,"room":<tspan fill="#9BE7B4">"call-…-4155"</tspan>,"url":<tspan fill="#9BE7B4">"wss://…"</tspan>}</text>
      <text y="160" fill="#5A6678">$ <tspan fill="#E8EDF4">agent-bluetooth call +18005551234</tspan></text>
      <text y="198" fill="#3E4A5C">{"ok":<tspan fill="#C98BF0">true</tspan>}</text>
      <text y="240" fill="#5A6678">$ <tspan fill="#E8EDF4">agent-bluetooth sms +1555… "on my way"</tspan></text>
      <text y="282" fill="#3E4A5C">{"type":<tspan fill="#8FC7F3">"sms.sent"</tspan>}</text>

      <text y="344" fill="#5A6678"># rules, no code:</text>
      <text y="382" fill="#7E8AA0">on <tspan fill="#8FC7F3">sms.received</tspan> · extract <tspan fill="#9BE7B4">(\d{4,8})</tspan> → <tspan fill="#E8EDF4">telegram</tspan></text>
      <text y="420" fill="#2DA7F0">🔐 code 582194 → forwarded</text>
    </g>
  </g>

  <text x="130" y="846" font-size="22" fill="#8B96A5">calls · SMS · contacts · recording · AI agents — all on your real number</text>
</svg>
