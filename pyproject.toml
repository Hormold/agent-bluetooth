[project]
name = "agent-bluetooth"
version = "0.1.0"
description = "Let your AI agent make and take calls on your real phone, over a USB Bluetooth dongle and LiveKit"
readme = "README.md"
license = "MIT"
keywords = ["bluetooth", "hfp", "telephony", "livekit", "voice-agent", "ai-agent", "sms", "bumble"]
authors = [
    { name = "Nikita", email = "hormold@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.14.5",
    "bumble>=0.0.236",
    "livekit>=1.1.21",
    "livekit-api>=1.2.2",
]

[project.urls]
Homepage = "https://github.com/Hormold/agent-bluetooth"
Issues = "https://github.com/Hormold/agent-bluetooth/issues"

[project.scripts]
agent-bluetooth = "agent_bluetooth.cli:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"
