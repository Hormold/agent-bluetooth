[project]
name = "agent-bluetooth"
version = "0.1.0"
description = "Turn any phone into an API and a LiveKit room over Bluetooth"
readme = "README.md"
authors = [
    { name = "Nikita", email = "hormold@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.14.5",
    "bumble>=0.0.236",
    "livekit>=1.1.21",
    "livekit-api>=1.2.2",
]

[project.scripts]
agent-bluetooth = "agent_bluetooth.cli:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"
